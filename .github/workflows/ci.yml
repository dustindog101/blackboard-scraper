name: CI (Cross-Platform)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Checks
        run: |
          ruff check .

  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Base Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Install Playwright Browsers
        run: |
          python -m playwright install chromium --no-shell

      - name: Run Unit Tests
        run: |
          python -m pytest tests -q

      - name: Test CLI Smoke Test & Console Encodings
        run: |
          python main.py --help

  browser-smoke:
    name: Browser smoke (${{ matrix.os }}, ${{ matrix.browser }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            browser: chrome
          - os: windows-latest
            browser: msedge
          - os: ubuntu-latest
            browser: chromium
    env:
      BB_BROWSER_SMOKE: '1'
      # Windows/macOS start with an empty cache and perform NO browser install.
      PLAYWRIGHT_BROWSERS_PATH: .pw-browser-smoke-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies only
        run: python -m pip install -r requirements.txt
      - name: Install full Chromium without headless shell (fallback coverage)
        if: matrix.browser == 'chromium'
        run: python -m playwright install chromium --no-shell --with-deps
      - name: Verify automatic installed-browser preference
        if: matrix.browser != 'chromium'
        shell: bash
        run: |
          python -c "from core.browser import get_browser_launch_candidates; candidates = get_browser_launch_candidates(); assert candidates and not candidates[0].get('bundled')"
      - name: Exercise automatic installed-browser selection
        if: matrix.browser != 'chromium'
        run: python -m unittest discover -s tests -p "test_browser_smoke.py" -v
      - name: Exercise pinned installed browser or minimal fallback
        env:
          BLACKBOARD_BROWSER: ${{ matrix.browser }}
        run: python -m unittest discover -s tests -p "test_browser_smoke.py" -v
